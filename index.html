/* Purge any expired/stale persisted session BEFORE the client is created.
   supabase-js auto-attempts a network refresh on init for an expired
   session, which was hammering an already-exhausted rate limit. A fresh
   password sign-in uses a separate limit, so starting clean avoids it. */
(function purgeStaleSession() {
  try {
    const projectRef = new URL(SUPABASE_URL).hostname.split(".")[0];
    const key = "sb-" + projectRef + "-auth-token";
    const raw = window.localStorage.getItem(key);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    const expiresAt = parsed && parsed.expires_at;
    const now = Math.floor(Date.now() / 1000);
    if (!expiresAt || expiresAt < now + 30) {
      window.localStorage.removeItem(key);
    }
  } catch (e) {
    // If anything looks malformed, don't risk it — drop it.
    try {
      const projectRef = new URL(SUPABASE_URL).hostname.split(".")[0];
      window.localStorage.removeItem("sb-" + projectRef + "-auth-token");
    } catch (e2) {}
  }
})();

================================================================ */
function App() {
  const [session, setSession] = useState(undefined); // undefined = checking, null = logged out
  const [profile, setProfile] = useState(null);
  const [profileError, setProfileError] = useState(null);
  const [view, setView] = useState("dashboard");

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session || null));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => {
      setSession(sess || null);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setProfile(null); setProfileError(null); return; }
    let cancelled = false;
    sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle().then(({ data, error }) => {
      if (cancelled) return;
      if (error) {
        console.error("profile fetch error:", error);
        setProfileError(error.message || JSON.stringify(error));
        setProfile(null);
      } else if (!data) {
        setProfileError("مفيش بروفايل لهذا الحساب في جدول profiles. تأكد إن صف الأدمن موجود بنفس الـ id بتاع الحساب.");
        setProfile(null);
      } else {
        setProfile(data);
        setProfileError(null);
      }
    });
    return () => { cancelled = true; };
  }, [session]);

  useEffect(() => {
    document.documentElement.dir = "rtl";
  }, []);

  if (session === undefined) {
    return <FullscreenLoader />;
  }

  if (!session) {
    return <LoginScreen />;
  }

  if (profileError) {
    return (
      <div dir="rtl" style={{ fontFamily: "Cairo, sans-serif" }} className="flex h-screen w-full flex-col items-center justify-center gap-4 bg-slate-50 p-6 text-center">
        <div className="rounded-2xl border border-rose-200 bg-rose-50 p-6 max-w-md">
          <div className="mb-2 text-lg font-extrabold text-rose-700">حصل خطأ في تحميل حسابك</div>
          <div className="mb-4 text-sm text-rose-600" dir="ltr">{profileError}</div>
          <button onClick={() => sb.auth.signOut({ scope: "local" })} className="rounded-xl bg-slate-900 px-4 py-2 text-sm font-bold text-white">
            تسجيل الخروج والمحاولة تاني
          </button>
        </div>
      </div>
    );
  }

  if (!profile) {
    return <FullscreenLoader text="جارِ تجهيز حسابك..." />;
  }

  return (
    <div dir="rtl" style={{ fontFamily: "Cairo, sans-serif" }} className="flex h-screen w-full bg-slate-50 text-slate-900">
      <Sidebar profile={profile} view={view} setView={setView} onLogout={() => sb.auth.signOut()} />
      <main className="flex-1 overflow-y-auto">
        {view === "dashboard" && <Dashboard profile={profile} />}
        {view === "shipments" && <ShipmentsView profile={profile} />}
        {view === "customers" && <CustomersView profile={profile} />}
        {view === "users" && profile.role === "admin" && <UsersView profile={profile} />}
      </main>
    </div>
  );
}

function FullscreenLoader({ text = "جارِ التحميل..." }) {
  return (
    <div className="flex h-screen items-center justify-center bg-slate-50" style={{ fontFamily: "Cairo, sans-serif" }}>
      <div className="flex flex-col items-center gap-3">
        <div className="h-10 w-10 animate-spin rounded-full border-4 border-slate-200 border-t-slate-900" />
        <div className="text-slate-500 font-medium">{text}</div>
      </div>
    </div>
  );
}

/* ---------------- Login ---------------- */
function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setBusy(true);
    setErr("");
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (error) setErr("البريد الإلكتروني أو كلمة المرور غير صحيحة");
    setBusy(false);
  }

  return (
    <div dir="rtl" style={{ fontFamily: "Cairo, sans-serif" }} className="flex h-screen w-full items-center justify-center bg-slate-950 relative overflow-hidden">
      <div className="pointer-events-none absolute -top-24 -right-24 h-96 w-96 rounded-full bg-amber-500/10 blur-3xl" />
      <div className="pointer-events-none absolute -bottom-24 -left-24 h-96 w-96 rounded-full bg-sky-500/10 blur-3xl" />
      <div className="relative w-full max-w-sm">
        <div className="mb-8 text-center">
          <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-amber-500 text-slate-950 font-black text-2xl shadow-lg shadow-amber-500/20">
            A&M
          </div>
          <h1 className="text-2xl font-extrabold text-white">نظام إدارة الشحن</h1>
          <p className="mt-1 text-sm text-slate-400">سجّل دخولك للمتابعة</p>
        </div>
        <form onSubmit={submit} className="rounded-2xl border border-white/10 bg-white/5 p-6 backdrop-blur">
          <label className="mb-1.5 block text-xs font-bold text-slate-300">البريد الإلكتروني</label>
          <div className="mb-4 flex items-center gap-2 rounded-xl border border-white/10 bg-slate-900 px-3 py-2.5">
            <Mail size={16} className="text-slate-500" />
            <input
              type="email"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              className="w-full bg-transparent text-sm text-white outline-none placeholder:text-slate-600"
              placeholder="name@example.com"
              dir="ltr"
            />
          </div>
          <label className="mb-1.5 block text-xs font-bold text-slate-300">كلمة المرور</label>
          <div className="mb-2 flex items-center gap-2 rounded-xl border border-white/10 bg-slate-900 px-3 py-2.5">
            <Lock size={16} className="text-slate-500" />
            <input
              type={showPw ? "text" : "password"}
              value={password}
              onChange={(e) => setPassword(e.target.value)}
              className="w-full bg-transparent text-sm text-white outline-none placeholder:text-slate-600"
              placeholder="••••••••"
              dir="ltr"
            />
            <button type="button" onClick={() => setShowPw((s) => !s)} className="text-slate-500 hover:text-slate-300">
              {showPw ? <EyeOff size={16} /> : <Eye size={16} />}
            </button>
          </div>
          {err && <div className="mb-3 text-xs font-bold text-rose-400">{err}</div>}
          <button
            type="submit"
            disabled={busy}
            className="mt-2 w-full rounded-xl bg-amber-500 py-2.5 text-sm font-extrabold text-slate-950 transition hover:bg-amber-400 disabled:opacity-50"
          >
            {busy ? "جارِ الدخول..." : "دخول"}
          </button>
        </form>
        <div className="mt-5 flex items-start gap-2 rounded-xl border border-white/10 bg-white/5 p-4 text-xs text-slate-400 leading-6">
          <Info size={14} className="mt-0.5 flex-shrink-0" />
          <span>الحسابات الجديدة (عملاء / مناديب) بتتضاف من لوحة Supabase، وبعدين تتظبط أسماؤهم وأدوارهم من صفحة "المستخدمين" داخل النظام.</span>
        </div>

}

/* ---------------- Dashboard ---------------- */
function Dashboard({ profile }) {
  const [shipments, setShipments] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    sb.from("shipments").select("*").order("created_at", { ascending: false }).then(({ data, error }) => {
      if (!cancelled) { setShipments(error ? [] : data); setLoading(false); }
    });
    return () => { cancelled = true; };
  }, []);

  const stats = useMemo(() => {
    let pendingCount = 0, pendingSum = 0;
    let deliveredSum = 0, deliveredCount = 0;
    let returnedSum = 0, returnedCount = 0;
    let partialCount = 0, shippingSum = 0;
    for (const s of shipments) {
      shippingSum += Number(s.shipping_fee) || 0;
      if (s.status === "pending") { pendingCount++; pendingSum += Number(s.order_value); }
      if (s.status === "delivered") { deliveredCount++; deliveredSum += Number(s.order_value); }
      if (s.status === "returned") { returnedCount++; returnedSum += Number(s.order_value); }
      if (s.status === "partial") {
        partialCount++;
        deliveredSum += Number(s.delivered_amount);
        returnedSum += Number(s.returned_amount);
      }
    }
    return { pendingCount, pendingSum, deliveredSum, deliveredCount, returnedSum, returnedCount, partialCount, shippingSum, total: shipments.length };
  }, [shipments]);

  if (loading) return <div className="p-8"><FullscreenLoader text="جارِ تحميل البيانات..." /></div>;

  return (
    <div className="p-6 md:p-8">

/* ---------------- Shipments ---------------- */
function ShipmentsView({ profile }) {
  const [shipments, setShipments] = useState([]);
  const [profiles, setProfiles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);
  const [partialFor, setPartialFor] = useState(null);
  const [showImport, setShowImport] = useState(false);

  async function loadShipments() {
    setLoading(true);
    const { data, error } = await sb.from("shipments").select("*").order("created_at", { ascending: false });
    setShipments(error ? [] : data);
    setLoading(false);
  }
  async function loadProfiles() {
    const { data } = await sb.from("profiles").select("*");
    setProfiles(data || []);
  }

  useEffect(() => { loadShipments(); loadProfiles(); }, []);

  const visible = useMemo(() => {
    let list = shipments;
    if (statusFilter !== "all") list = list.filter((s) => s.status === statusFilter);
    const q = query.trim().toLowerCase();
    if (q) {
      list = list.filter(
        (s) => s.customer_name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q) || (s.customer_phone || "").includes(q)
      );
    }
    return list;
  }, [shipments, statusFilter, query]);

  async function saveShipment(form) {
    const payload = {
      code: form.code || uid("AM-"),
      customer_name: form.customerName,
      customer_phone: form.customerPhone,
      address: form.address,
      order_value: Number(form.orderValue) || 0,
      shipping_fee: Number(form.shippingFee) || 0,
      agent_id: form.agentId || null,
      client_id: profile.role === "client" ? profile.id : (form.clientId || null),
      notes: form.notes || "",
    };
    if (form.id) {
      await sb.from("shipments").update(payload).eq("id", form.id);
    } else {
      payload.status = "pending";
      payload.delivered_amount = 0;
      payload.returned_amount = 0;
      await sb.from("shipments").insert(payload);
      const { data: existing } = await sb.from("customers").select("id").eq("phone", form.customerPhone).maybeSingle();
      if (!existing) {
        await sb.from("customers").insert({ name: form.customerName, phone: form.customerPhone, address: form.address });
      }
    }
    await loadShipments();
    setShowForm(false);
    setEditing(null);
  }

  async function updateStatus(shipment, status, deliveredAmount) {
    let payload = { status };
    if (status === "partial") {
      const d = Math.max(0, Math.min(Number(deliveredAmount) || 0, shipment.order_value));
      payload.delivered_amount = d;
      payload.returned_amount = shipment.order_value - d;
    } else if (status === "delivered") {
      payload.delivered_amount = shipment.order_value;
      payload.returned_amount = 0;
    } else if (status === "returned") {
      payload.delivered_amount = 0;
      payload.returned_amount = shipment.order_value;
    } else {
      payload.delivered_amount = 0;
      payload.returned_amount = 0;
    }
    await sb.from("shipments").update(payload).eq("id", shipment.id);
    await loadShipments();
    setPartialFor(null);
  }

  async function deleteShipment(id) {
    await sb.from("shipments").delete().eq("id", id);
    await loadShipments();
  }

  async function bulkImport(rows) {
    const payload = rows.map((r) => ({
      code: uid("AM-"),
      customer_name: r.customerName,
      customer_phone: r.customerPhone || "",
      address: r.address || "",
      order_value: Number(r.orderValue) || 0,
      shipping_fee: Number(r.shippingFee) || 0,
      status: "pending",
      delivered_amount: 0,
      returned_amount: 0,
      client_id: profile.role === "client" ? profile.id : null,
      notes: r.notes || "",
    }));
    await sb.from("shipments").insert(payload);
    for (const r of payload) {
      if (!r.customer_phone) continue;
      const { data: existing } = await sb.from("customers").select("id").eq("phone", r.customer_phone).maybeSingle();
      if (!existing) await sb.from("customers").insert({ name: r.customer_name, phone: r.customer_phone, address: r.address });
    }
    await loadShipments();
    setShowImport(false);
  }

  if (loading) return <div className="p-8"><FullscreenLoader text="جارِ تحميل الشحنات..." /></div>;

  return (
    <div className="p-6 md:p-8">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-2xl font-extrabold text-slate-900">الشحنات</h1>
          <p className="mt-1 text-sm text-slate-500">إدارة ومتابعة كل الشحنات</p>
        </div>
        {profile.role !== "agent" && (
          <div className="flex items-center gap-2">
            <button
              onClick={() => setShowImport(true)}
              className="flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-50"
            >
              <FileSpreadsheet size={16} /> استيراد من إكسل
            </button>
            <button
              onClick={() => { setEditing(null); setShowForm(true); }}
              className="flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-bold text-white hover:bg-slate-800"
            >
              <Plus size={16} /> شحنة جديدة
            </button>
          </div>
        )}
      </div>

      <div className="mt-5 flex flex-wrap items-center gap-3">
        <div className="flex flex-1 min-w-[220px] items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2.5">
          <Search size={16} className="text-slate-400" />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="ابحث بالاسم أو الكود أو رقم الهاتف..."
            className="w-full bg-transparent text-sm outline-none placeholder:text-slate-400"
          />
        </div>
        <div className="flex items-center gap-1 overflow-x-auto">
          {["all", "pending", "delivered", "returned", "partial"].map((k) => (
            <button
              key={k}
              onClick={() => setStatusFilter(k)}
              className={`whitespace-nowrap rounded-xl px-3 py-2 text-xs font-bold transition ${
                statusFilter === k ? "bg-slate-900 text-white" : "bg-white text-slate-600 border border-slate-200 hover:bg-slate-50"
              }`}
            >
              {k === "all" ? "الكل" : STATUS[k].label}
            </button>
          ))}
        </div>
      </div>

      <div className="mt-5 overflow-hidden rounded-2xl border border-slate-200 bg-white">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500">
            <tr>
              <th className="px-4 py-3 text-right font-bold">الكود</th>
              <th className="px-4 py-3 text-right font-bold">العميل</th>
              <th className="px-4 py-3 text-right font-bold">الهاتف</th>
              <th className="px-4 py-3 text-right font-bold">القيمة</th>
              <th className="px-4 py-3 text-right font-bold">الشحن</th>
              <th className="px-4 py-3 text-right font-bold">الحالة</th>
              <th className="px-4 py-3 text-right font-bold">إجراءات</th>
            </tr>
          </thead>
          <tbody>
            {visible.map((s) => (
              <tr key={s.id} className="border-t border-slate-100 align-top">
                <td className="px-4 py-3 font-mono text-slate-600 flex items-center gap-1">
                  <Hash size={12} className="text-slate-300" />{s.code}
                </td>
                <td className="px-4 py-3 font-bold">{s.customer_name}
                  {s.status === "partial" && (
                    <div className="mt-1 text-xs font-medium text-amber-600">
                      محصّل {fmt(s.delivered_amount)} / مرتجع {fmt(s.returned_amount)}
                    </div>
                  )}
                </td>
                <td className="px-4 py-3 text-slate-500">{s.customer_phone}</td>
                <td className="px-4 py-3 font-bold">{fmt(s.order_value)} ج.م</td>
                <td className="px-4 py-3 text-amber-600 font-bold">{fmt(s.shipping_fee || 0)} ج.م</td>
                <td className="px-4 py-3"><StatusBadge status={s.status} /></td>
                <td className="px-4 py-3">
                  <div className="flex flex-wrap items-center gap-1.5">
                    {profile.role !== "client" && (
                      <>
                        <button onClick={() => updateStatus(s, "delivered")} title="تم التسليم"
                          className="rounded-lg bg-emerald-50 p-1.5 text-emerald-600 hover:bg-emerald-100">
                          <CheckCircle2 size={15} />
                        </button>
                        <button onClick={() => updateStatus(s, "returned")} title="مرتجع"
                          className="rounded-lg bg-rose-50 p-1.5 text-rose-600 hover:bg-rose-100">
                          <RotateCcw size={15} />
                        </button>
                        <button onClick={() => setPartialFor(s)} title="جزئي"
                          className="rounded-lg bg-amber-50 p-1.5 text-amber-600 hover:bg-amber-100">
                          <AlertTriangle size={15} />
                        </button>
                      </>
                    )}
                    {profile.role !== "agent" && (
                      <>
                        <button onClick={() => { setEditing(s); setShowForm(true); }} title="تعديل"
                          className="rounded-lg bg-slate-100 p-1.5 text-slate-600 hover:bg-slate-200">
                          <Edit3 size={15} />
                        </button>
                        {profile.role === "admin" && (
                          <button onClick={() => deleteShipment(s.id)} title="حذف"
                            className="rounded-lg bg-slate-100 p-1.5 text-slate-600 hover:bg-rose-100 hover:text-rose-600">
                            <Trash2 size={15} />
                          </button>
                        )}
                      </>
                    )}
                  </div>
                </td>
              </tr>
            ))}
            {visible.length === 0 && (
              <tr><td colSpan={7} className="px-4 py-10 text-center text-slate-400">لا توجد نتائج</td></tr>
            )}
          </tbody>
        </table>
      </div>

      {showForm && (
        <ShipmentForm
          initial={editing}
          profiles={profiles}
          profile={profile}
          onCancel={() => { setShowForm(false); setEditing(null); }}
          onSave={saveShipment}
        />
      )}

      {partialFor && (
        <PartialModal
          shipment={partialFor}
          onCancel={() => setPartialFor(null)}
          onConfirm={(amount) => updateStatus(partialFor, "partial", amount)}
        />
      )}

      {showImport && (
        <ImportModal onCancel={() => setShowImport(false)} onConfirm={bulkImport} />
      )}
    </div>
  );
}

/* ---------------- Excel bulk import ---------------- */
const HEADER_MAP = {
  customerName: ["اسم العميل", "الاسم", "العميل", "name", "customer", "customer name"],
  customerPhone: ["الهاتف", "رقم الهاتف", "موبايل", "التليفون", "phone", "mobile"],
  address: ["العنوان", "عنوان", "address"],
  orderValue: ["القيمة", "قيمة الاوردر", "قيمة الأوردر", "السعر", "قيمة", "value", "price", "amount"],
  shippingFee: ["الشحن", "قيمة الشحن", "مصاريف الشحن", "shipping", "shipping fee"],
  notes: ["ملاحظات", "notes", "ملاحظة"],
};

function detectColumns(headerRow) {
  const norm = headerRow.map((h) => String(h || "").trim().toLowerCase());
  const mapping = {};
  for (const field of Object.keys(HEADER_MAP)) {
    const idx = norm.findIndex((h) => HEADER_MAP[field].some((alias) => h === alias.toLowerCase() || h.includes(alias.toLowerCase())));
    mapping[field] = idx;
  }
  return mapping;
}

function ImportModal({ onCancel, onConfirm }) {
  const [rows, setRows] = useState([]);
  const [fileName, setFileName] = useState("");
  const [err, setErr] = useState("");
  const [parsing, setParsing] = useState(false);
  const [importing, setImporting] = useState(false);

  function handleFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setFileName(file.name);
    setErr("");
    setParsing(true);
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const asArrays = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!asArrays.length) { setErr("الملف فارغ"); setParsing(false); return; }

        const header = asArrays[0];
        const mapping = detectColumns(header);
        const hasHeaderMatch = Object.values(mapping).some((v) => v !== -1);
        const dataRows = hasHeaderMatch ? asArrays.slice(1) : asArrays;
        const m = hasHeaderMatch ? mapping : { customerName: 0, customerPhone: 1, address: 2, orderValue: 3, shippingFee: 4, notes: 5 };

        const parsed = dataRows
          .filter((r) => r.some((cell) => String(cell).trim() !== ""))
          .map((r) => ({
            customerName: m.customerName > -1 ? String(r[m.customerName] || "").trim() : "",
            customerPhone: m.customerPhone > -1 ? String(r[m.customerPhone] || "").trim() : "",
            address: m.address > -1 ? String(r[m.address] || "").trim() : "",
            orderValue: m.orderValue > -1 ? r[m.orderValue] : 0,
            shippingFee: m.shippingFee > -1 ? r[m.shippingFee] : 0,
            notes: m.notes > -1 ? String(r[m.notes] || "").trim() : "",
          }))
          .filter((r) => r.customerName);

        if (!parsed.length) { setErr("مفيش صفوف بيانات صالحة في الملف"); setParsing(false); return; }
        setRows(parsed);
      } catch (e2) {
        setErr("تعذّر قراءة الملف — تأكد إنه ملف إكسل (xlsx) أو CSV سليم");
      } finally {
        setParsing(false);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
      <div className="flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden rounded-2xl bg-white shadow-xl">
        <div className="flex items-center justify-between border-b border-slate-100 px-6 py-4">
          <h3 className="text-lg font-extrabold text-slate-900">استيراد شحنات من إكسل</h3>
          <button onClick={onCancel} className="text-slate-400 hover:text-slate-600"><X size={18} /></button>
        </div>

        <div className="overflow-y-auto px-6 py-4">
          {rows.length === 0 ? (
            <div>
              <label className="flex cursor-pointer flex-col items-center gap-2 rounded-2xl border-2 border-dashed border-slate-200 px-6 py-10 text-center hover:border-amber-400 hover:bg-amber-50/30">
                <UploadCloud size={28} className="text-slate-400" />
                <span className="text-sm font-bold text-slate-700">اضغط لاختيار ملف إكسل أو CSV</span>
                <span className="text-xs text-slate-400">هيتعرف تلقائي على أعمدة: اسم العميل، الهاتف، العنوان، القيمة، الشحن، ملاحظات</span>
                <input type="file" accept=".xlsx,.xls,.csv" className="hidden" onChange={handleFile} />
              </label>
              {parsing && <div className="mt-3 text-center text-sm text-slate-500">جارِ القراءة...</div>}
              {err && <div className="mt-3 text-center text-sm font-bold text-rose-500">{err}</div>}
              <div className="mt-4 rounded-xl bg-slate-50 p-3 text-xs leading-6 text-slate-500">
                لو أول صف في الملف عناوين أعمدة (زي "اسم العميل"، "الهاتف"...) هيتعرف عليها تلقائي.
                لو مفيش عناوين، هيقرأ الأعمدة بالترتيب: الاسم، الهاتف، العنوان، القيمة، الشحن، ملاحظات.
              </div>
            </div>
          ) : (
            <div>
              <div className="mb-3 flex items-center gap-2 text-sm font-bold text-emerald-700">
                <CheckCircle2 size={16} /> تم قراءة {fmt(rows.length)} صف من "{fileName}"
              </div>
              <div className="max-h-72 overflow-y-auto rounded-xl border border-slate-200">
                <table className="w-full text-xs">
                  <thead className="sticky top-0 bg-slate-50 text-slate-500">
                    <tr>
                      <th className="px-3 py-2 text-right font-bold">الاسم</th>
                      <th className="px-3 py-2 text-right font-bold">الهاتف</th>
                      <th className="px-3 py-2 text-right font-bold">العنوان</th>
                      <th className="px-3 py-2 text-right font-bold">القيمة</th>
                      <th className="px-3 py-2 text-right font-bold">الشحن</th>
                    </tr>
                  </thead>
                  <tbody>
                    {rows.slice(0, 50).map((r, i) => (
                      <tr key={i} className="border-t border-slate-100">
                        <td className="px-3 py-2 font-bold">{r.customerName}</td>
                        <td className="px-3 py-2 text-slate-500">{r.customerPhone}</td>
                        <td className="px-3 py-2 text-slate-500">{r.address}</td>
                        <td className="px-3 py-2">{r.orderValue}</td>
                        <td className="px-3 py-2">{r.shippingFee}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {rows.length > 50 && <div className="mt-2 text-xs text-slate-400">...و{fmt(rows.length - 50)} صف تاني</div>}
              <button onClick={() => { setRows([]); setFileName(""); }} className="mt-3 text-xs font-bold text-slate-500 underline">
                اختيار ملف آخر
              </button>
            </div>
          )}
        </div>

        <div className="flex gap-2 border-t border-slate-100 px-6 py-4">
          <button onClick={onCancel} className="flex-1 rounded-xl border border-slate-200 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50">
            إلغاء
          </button>
          <button
            onClick={async () => { setImporting(true); await onConfirm(rows); setImporting(false); }}
            disabled={rows.length === 0 || importing}
            className="flex-1 rounded-xl bg-amber-500 py-2.5 text-sm font-bold text-white hover:bg-amber-600 disabled:opacity-40"
          >
            {importing ? "جارِ الاستيراد..." : `استيراد ${rows.length > 0 ? `(${fmt(rows.length)})` : ""}`}
          </button>
        </div>
      </div>
    </div>
  );
}

function PartialModal({ shipment, onCancel, onConfirm }) {
  const [amount, setAmount] = useState("");
  const delivered = Math.max(0, Math.min(Number(amount) || 0, shipment.order_value));
  const returned = shipment.order_value - delivered;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
      <div className="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl">
        <div className="mb-1 flex items-center gap-2 text-amber-600">
          <AlertTriangle size={18} />
          <h3 className="text-lg font-extrabold text-slate-900">تسليم جزئي</h3>
        </div>
        <p className="mb-4 text-sm text-slate-500">قيمة الأوردر: {fmt(shipment.order_value)} ج.م — أدخل المبلغ المحصّل فعليًا</p>
        <input
          type="number"
          autoFocus
          value={amount}
          onChange={(e) => setAmount(e.target.value)}
          placeholder="المبلغ المحصّل"
          className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-amber-500"
        />
        <div className="mt-3 flex items-center justify-between rounded-xl bg-slate-50 px-3 py-2.5 text-sm">
          <span className="font-bold text-emerald-600">محصّل: {fmt(delivered)}</span>
          <span className="font-bold text-rose-600">مرتجع: {fmt(returned)}</span>
        </div>
        <div className="mt-5 flex gap-2">
          <button onClick={onCancel} className="flex-1 rounded-xl border border-slate-200 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50">
            إلغاء
          </button>
          <button
            onClick={() => onConfirm(delivered)}
            disabled={amount === ""}
            className="flex-1 rounded-xl bg-amber-500 py-2.5 text-sm font-bold text-white hover:bg-amber-600 disabled:opacity-40"
          >
            تأكيد
          </button>
        </div>
      </div>
    </div>
  );
}

function ShipmentForm({ initial, profiles, profile, onCancel, onSave }) {
  const [form, setForm] = useState(
    initial
      ? {
          id: initial.id,
          code: initial.code,
          customerName: initial.customer_name,
          customerPhone: initial.customer_phone,
          address: initial.address || "",
          orderValue: initial.order_value,
          shippingFee: initial.shipping_fee,
          agentId: initial.agent_id || "",
          clientId: initial.client_id || "",
          notes: initial.notes || "",
        }
      : {
          customerName: "",
          customerPhone: "",
          address: "",
          orderValue: "",
          shippingFee: "",
          agentId: "",
          clientId: "",
          notes: "",
        }
  );
  const [err, setErr] = useState("");
  const [saving, setSaving] = useState(false);
  const agents = profiles.filter((u) => u.role === "agent");
  const clients = profiles.filter((u) => u.role === "client");

  async function submit(e) {
    e.preventDefault();
    if (!form.customerName.trim() || !form.customerPhone.trim() || !form.orderValue) {
      setErr("من فضلك أدخل اسم العميل والهاتف وقيمة الأوردر");
      return;
    }
    setSaving(true);
    await onSave(form);
    setSaving(false);
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
      <form onSubmit={submit} className="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-6 shadow-xl">
        <div className="mb-4 flex items-center justify-between">
          <h3 className="text-lg font-extrabold text-slate-900">{initial ? "تعديل الشحنة" : "شحنة جديدة"}</h3>
          <button type="button" onClick={onCancel} className="text-slate-400 hover:text-slate-600"><X size={18} /></button>
        </div>

        <div className="space-y-3">
          <div>
            <label className="mb-1 block text-xs font-bold text-slate-500">اسم العميل</label>
            <div className="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2.5 focus-within:border-slate-900">
              <User size={15} className="text-slate-400" />
              <input required value={form.customerName} onChange={(e) => setForm({ ...form, customerName: e.target.value })}
                className="w-full bg-transparent text-sm outline-none" placeholder="اسم العميل" />
            </div>
          </div>
          <div>
            <label className="mb-1 block text-xs font-bold text-slate-500">رقم الهاتف</label>
            <div className="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2.5 focus-within:border-slate-900">
              <Phone size={15} className="text-slate-400" />
              <input required value={form.customerPhone} onChange={(e) => setForm({ ...form, customerPhone: e.target.value })}
                className="w-full bg-transparent text-sm outline-none" placeholder="01xxxxxxxxx" />
            </div>
          </div>
          <div>
            <label className="mb-1 block text-xs font-bold text-slate-500">العنوان</label>
            <div className="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2.5 focus-within:border-slate-900">
              <MapPin size={15} className="text-slate-400" />
              <input value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })}
                className="w-full bg-transparent text-sm outline-none" placeholder="العنوان بالتفصيل" />
            </div>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="mb-1 block text-xs font-bold text-slate-500">قيمة الأوردر (ج.م)</label>
              <input required type="number" value={form.orderValue} onChange={(e) => setForm({ ...form, orderValue: e.target.value })}
                className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-900" placeholder="0" />
            </div>
            <div>
              <label className="mb-1 block text-xs font-bold text-slate-500">قيمة الشحن (ج.م)</label>
              <input type="number" value={form.shippingFee} onChange={(e) => setForm({ ...form, shippingFee: e.target.value })}
                className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-900" placeholder="0" />
            </div>
          </div>

          {profile.role === "admin" && (
            <div>
              <label className="mb-1 block text-xs font-bold text-slate-500">العميل صاحب الحساب (اختياري)</label>
              <select value={form.clientId} onChange={(e) => setForm({ ...form, clientId: e.target.value })}
                className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-900">
                <option value="">بدون</option>
                {clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
          )}

          {profile.role !== "agent" && (
            <div>
              <label className="mb-1 block text-xs font-bold text-slate-500">تعيين مندوب</label>
              <select value={form.agentId} onChange={(e) => setForm({ ...form, agentId: e.target.value })}
                className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-900">
                <option value="">بدون تعيين</option>
                {agents.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>
          )}

          <div>
            <label className="mb-1 block text-xs font-bold text-slate-500">ملاحظات</label>
            <textarea value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })}
              rows={2} className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-900" />
          </div>
        </div>

        {err && <div className="mt-3 text-xs font-bold text-rose-500">{err}</div>}

        <div className="mt-5 flex gap-2">
          <button type="button" onClick={onCancel} className="flex-1 rounded-xl border border-slate-200 py-2.5 text-sm font-bold text-slate-600 hover:bg-slate-50">
            إلغاء
          </button>
          <button type="submit" disabled={saving} className="flex-1 rounded-xl bg-slate-900 py-2.5 text-sm font-bold text-white hover:bg-slate-800 disabled:opacity-50">
            {saving ? "جارِ الحفظ..." : initial ? "حفظ التعديلات" : "إضافة الشحنة"}
          </button>
        </div>
      </form>
    </div>
  );
}

/* ---------------- Customers ---------------- */
function CustomersView({ profile }) {
  const [customers, setCustomers] = useState([]);
  const [shipments, setShipments] = useState([]);
  const [loading, setLoading] = useState(true);
  const [query, setQuery] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ name: "", phone: "", address: "" });

  async function load() {
    setLoading(true);
    const [{ data: c }, { data: s }] = await Promise.all([
      sb.from("customers").select("*"),
      sb.from("shipments").select("customer_name, customer_phone, order_value"),
    ]);
    setCustomers(c || []);
    setShipments(s || []);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  const stats = useMemo(() => {
    const map = {};
    for (const c of customers) map[c.phone] = { ...c, orders: 0, total: 0 };
    for (const s of shipments) {
      if (!map[s.customer_phone]) map[s.customer_phone] = { name: s.customer_name, phone: s.customer_phone, orders: 0, total: 0 };
      map[s.customer_phone].orders += 1;
      map[s.customer_phone].total += Number(s.order_value);
    }
    return Object.values(map);
  }, [customers, shipments]);

  const visible = stats.filter((c) => {
    const q = query.trim().toLowerCase();
    if (!q) return true;
    return c.name.toLowerCase().includes(q) || (c.phone || "").includes(q);
  });

  async function addCustomer(e) {
    e.preventDefault();
    if (!form.name.trim() || !form.phone.trim()) return;
    await sb.from("customers").insert(form);
    setForm({ name: "", phone: "", address: "" });
    setShowForm(false);
    await load();
  }

  if (loading) return <div className="p-8"><FullscreenLoader text="جارِ تحميل العملاء..." /></div>;

  return (
    <div className="p-6 md:p-8">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-2xl font-extrabold text-slate-900">العملاء</h1>
          <p className="mt-1 text-sm text-slate-500">كل العملاء وإجمالي طلباتهم</p>
        </div>
        <button onClick={() => setShowForm(true)} className="flex items-center gap-2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-bold text-white hover:bg-slate-800">
          <Plus size={16} /> عميل جديد
        </button>
      </div>

      <div className="mt-5 flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2.5 max-w-md">
        <Search size={16} className="text-slate-400" />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="ابحث بالاسم أو الهاتف..."
          className="w-full bg-transparent text-sm outline-none placeholder:text-slate-400" />
      </div>

      <div className="mt-5 grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3">
        {visible.map((c) => (
          <div key={c.phone} className="rounded-2xl border border-slate-200 bg-white p-4">
            <div className="flex items-center gap-3">
              <div className="flex h-10 w-10 items-center justify-center rounded-full bg-slate-100 font-bold text-slate-600">
                {c.name.slice(0, 1)}
              </div>
              <div>
                <div className="font-bold">{c.name}</div>
                <div className="text-xs text-slate-500">{c.phone}</div>
              </div>
            </div>
            {c.address && <div className="mt-2 text-xs text-slate-400">{c.address}</div>}
            <div className="mt-3 flex items-center justify-between border-t border-slate-100 pt-3 text-sm">
              <span className="text-slate-500">عدد الطلبات: <b className="text-slate-800">{fmt(c.orders || 0)}</b></span>
              <span className="font-bold text-slate-800">{fmt(c.total || 0)} ج.م</span>
            </div>
          </div>
        ))}
        {visible.length === 0 && <div className="col-span-full py-10 text-center text-slate-400">لا يوجد عملاء</div>}
      </div>

      {showForm && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
          <form onSubmit={addCustomer} className="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl">
            <div className="mb-4 flex items-center justify-between">
              <h3 className="text-lg font-extrabold text-slate-900">عميل جديد</h3>
              <button type="button" onClick={() => setShowForm(false)} className="text-slate-400 hover:text-slate-600"><X size={18} /></button>
            </div>
            <div className="space-y-3">
              <input required value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })}
                placeholder="اسم العميل" className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-900" />
              <input required value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })}
                placeholder="رقم الهاتف" className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-900" />
              <input value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })}
                placeholder="العنوان" className="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-slate-900" />
            </div>
            <button type="submit" className="mt-5 w-full rounded-xl bg-slate-900 py-2.5 text-sm font-bold text-white hover:bg-slate-800">
              إضافة
            </button>
          </form>
        </div>
      )}
    </div>
  );
}

/* ---------------- Users (admin only) ---------------- */
function UsersView({ profile }) {
  const [profiles, setProfiles] = useState([]);
  const [loading, setLoading] = useState(true);
  const [editingId, setEditingId] = useState(null);
  const [editForm, setEditForm] = useState({ name: "", role: "client" });

  async function load() {
    setLoading(true);
    const { data } = await sb.from("profiles").select("*").order("name");
    setProfiles(data || []);
    setLoading(false);
  }
  useEffect(() => { load(); }, []);

  function startEdit(p) {
    setEditingId(p.id);
    setEditForm({ name: p.name, role: p.role });
  }

  async function saveEdit(id) {
    await sb.from("profiles").update({ name: editForm.name, role: editForm.role }).eq("id", id);
    setEditingId(null);
    await load();
  }

  const roleLabel = { admin: "أدمن", client: "عميل", agent: "مندوب" };
  const roleColor = { admin: "bg-slate-900 text-white", client: "bg-sky-50 text-sky-700", agent: "bg-amber-50 text-amber-700" };

  if (loading) return <div className="p-8"><FullscreenLoader text="جارِ تحميل المستخدمين..." /></div>;

  return (
    <div className="p-6 md:p-8">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 className="text-2xl font-extrabold text-slate-900">المستخدمين</h1>
          <p className="mt-1 text-sm text-slate-500">إدارة حسابات العملاء والمناديب</p>
        </div>
      </div>

      <div className="mt-4 flex items-start gap-2 rounded-xl border border-sky-100 bg-sky-50 p-4 text-xs leading-6 text-sky-800">
        <Info size={16} className="mt-0.5 flex-shrink-0" />
        <span>
          لإضافة مستخدم جديد: روح لداشبورد Supabase → Authentication → Add user (حط الإيميل والباسورد وفعّل Auto Confirm).
          هيظهر هنا تلقائي كـ"عميل" — وبعدين تقدر تعدّل اسمه ودوره من الجدول تحت.
        </span>
      </div>

      <div className="mt-4 overflow-hidden rounded-2xl border border-slate-200 bg-white">
        <table className="w-full text-sm">
          <thead className="bg-slate-50 text-slate-500">
            <tr>
              <th className="px-4 py-3 text-right font-bold">الاسم</th>
              <th className="px-4 py-3 text-right font-bold">الدور</th>
              <th className="px-4 py-3 text-right font-bold"></th>
            </tr>
          </thead>
          <tbody>
            {profiles.map((u) => (
              <tr key={u.id} className="border-t border-slate-100">
                {editingId === u.id ? (
                  <>
                    <td className="px-4 py-3">
                      <input value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })}
                        className="w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm outline-none focus:border-slate-900" />
                    </td>
                    <td className="px-4 py-3">
                      <select value={editForm.role} onChange={(e) => setEditForm({ ...editForm, role: e.target.value })}
                        className="w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm outline-none focus:border-slate-900">
                        <option value="admin">أدمن</option>
                        <option value="client">عميل</option>
                        <option value="agent">مندوب</option>
                      </select>
                    </td>
                    <td className="px-4 py-3">
                      <div className="flex gap-1.5">
                        <button onClick={() => saveEdit(u.id)} className="rounded-lg bg-emerald-50 p-1.5 text-emerald-600 hover:bg-emerald-100">
                          <CheckCircle2 size={15} />
                        </button>
                        <button onClick={() => setEditingId(null)} className="rounded-lg bg-slate-100 p-1.5 text-slate-600 hover:bg-slate-200">
                          <X size={15} />
                        </button>
                      </div>
                    </td>
                  </>
                ) : (
                  <>
                    <td className="px-4 py-3 font-bold">{u.name}</td>
                    <td className="px-4 py-3"><span className={`rounded-full px-2.5 py-1 text-xs font-bold ${roleColor[u.role]}`}>{roleLabel[u.role]}</span></td>
                    <td className="px-4 py-3">
                      <button onClick={() => startEdit(u)} className="rounded-lg bg-slate-100 p-1.5 text-slate-600 hover:bg-slate-200">
                        <Edit3 size={15} />
                      </button>
                    </td>
                  </>
                )}
              </tr>
            ))}
            {profiles.length === 0 && (
              <tr><td colSpan={3} className="px-4 py-10 text-center text-slate-400">لا يوجد مستخدمين</td></tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
